name: Build tg_bridge
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone & Build tg_bridge
        run: |
          git clone --depth 1 https://github.com/mesamirh/MovieBox-Tui.git
          mkdir -p MovieBox-Tui/src/bin
          cp tg_bridge.rs MovieBox-Tui/src/bin/tg_bridge.rs
          cd MovieBox-Tui
          cargo build --release --bin tg_bridge
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: MovieBox-Tui/target/release/tg_bridge
          
